
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Registration Form</title>
</head>

<body>

   <h2>Registration Form</h2>

   <form action="/action.python">

      <input type="text" placeholder="Enter username">
      <br><br>

      <input type="password" placeholder="Enter Password">
      <br><br>

      <label for="id1">
         <input type="radio" value="class XI" name="class" id="id1">
         Class XI
      </label>

      <br><br>

      <label for="id2">
         <input type="radio" value="class XII" name="class" id="id2">
         Class XII
      </label>

      <h5>Select your favorite subjects</h5>

      <br>

      <label for="maths">
         <input type="checkbox" value="maths" name="subject" id="maths">
         Maths
      </label>

      <br><br>

      <label for="chem">
         <input type="checkbox" value="chem" name="subject" id="chem">
         Chemistry
      </label>

      <br><br>

      <label for="phy">
         <input type="checkbox" value="phy" name="subject" id="phy">
         Physics
      </label>

      <br><br>

      <label for="CS">
         <input type="checkbox" value="CS" name="subject" id="CS">
         CS
      </label>

      <br><br>

      <h5>Select your city</h5>

      <br>

      <select name="city" id="city">
         <option value="multan">Multan</option>
         <option value="sindh">Sindh</option>
         <option value="karachi">Karachi</option>
         <option value="lahore">Lahore</option>
         <option value="peshawar">Peshawar</option>
      </select>

      <br><br>

      <textarea name="feedback" id="feedback"
         placeholder="Please give your valuable feedback here"></textarea>

      <br>

      <input type="submit" value="Submit">

   </form>

</body>
</html>
